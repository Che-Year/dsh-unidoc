# dsh-unidoc bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add link:D:/Code/Codex/DSH-Unidoc`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (RPC /api/dsh-unidoc/rpc, doc_read/doc_edit/doc_create
# tools), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the
# web GUI.
- insert:
    - id: unidoc
      name: 'dsh-unidoc'
